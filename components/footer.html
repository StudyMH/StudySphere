      <span class="text-base font-black tracking-tight leading-none font-marathi">
        <span class="text-slate-900 dark:text-white">Study</span><span class="text-amber-500 dark:text-amber-400">Sphere</span>
      </span>
      <span class="text-[9.5px] px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-800 dark:text-amber-300 border border-amber-500/25 font-bold uppercase tracking-wider">
        MPSC Portal
      </span>
    </a>

    <!-- 2. Accessible Policy & Action Links (Single-line on mobile with zero horizontal scroll) -->
    <nav class="flex items-center justify-between sm:justify-center w-full max-w-sm sm:max-w-md mx-auto text-[10.5px] sm:text-xs font-bold text-slate-600 dark:text-slate-400 px-1 py-0.5 whitespace-nowrap select-none">
      <a href="./index.html" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors no-underline text-inherit">Home</a>
      <span class="text-slate-300 dark:text-slate-700 opacity-60">•</span>
      <button type="button" onclick="if(window.StudySphereCommon && window.StudySphereCommon.openPolicy){StudySphereCommon.openPolicy('about');}else if(window.openPolicy){openPolicy('about');}else{const m=document.getElementById('policiesModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer">About</button>
      <span class="text-slate-300 dark:text-slate-700 opacity-60">•</span>
      <button type="button" onclick="if(window.StudySphereCommon && window.StudySphereCommon.openPolicy){StudySphereCommon.openPolicy('privacy');}else if(window.openPolicy){openPolicy('privacy');}else{const m=document.getElementById('policiesModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer">Privacy</button>
      <span class="text-slate-300 dark:text-slate-700 opacity-60">•</span>
      <button type="button" onclick="if(window.StudySphereCommon && window.StudySphereCommon.openPolicy){StudySphereCommon.openPolicy('terms');}else if(window.openPolicy){openPolicy('terms');}else{const m=document.getElementById('policiesModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer">Terms</button>
      <span class="text-slate-300 dark:text-slate-700 opacity-60">•</span>
      <button type="button" onclick="if(window.StudySphereCommon && window.StudySphereCommon.openPolicy){StudySphereCommon.openPolicy('storage');}else if(window.openPolicy){openPolicy('storage');}else{const m=document.getElementById('policiesModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer">Storage</button>
      <span class="text-slate-300 dark:text-slate-700 opacity-60">•</span>
      <button type="button" onclick="if(window.StudySphereCommon && window.StudySphereCommon.openPolicy){StudySphereCommon.openPolicy('sitemap');}else if(window.openPolicy){openPolicy('sitemap');}else{const m=document.getElementById('policiesModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer">Sitemap</button>
      <span class="text-slate-300 dark:text-slate-700 opacity-60">•</span>
      <button type="button" onclick="if(window.StudySphereCommon && window.StudySphereCommon.openFeedbackModal){StudySphereCommon.openFeedbackModal();}else{const m=document.getElementById('feedbackModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer text-amber-600 dark:text-amber-400">Feedback</button>
    </nav>

    <!-- 3. Primary Community & Utility Action Buttons -->
    <div class="flex items-center justify-center gap-2 flex-wrap w-full pt-0.5">
      
      <!-- Button 1: Telegram Channel -->
      <a 
        href="https://t.me/MPSCstudysphere" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="h-8 px-3 rounded-xl bg-sky-500/10 hover:bg-sky-500/20 text-sky-700 dark:text-sky-300 text-xs font-bold inline-flex items-center gap-1.5 btn-spring no-underline shrink-0 border border-sky-400/30 shadow-2xs"
      >
        <i class="fa-brands fa-telegram text-xs"></i> <span>Telegram</span>
      </a>

      <!-- Button 2: Donate -->
      <button 
        onclick="if(window.StudySphereCommon && window.StudySphereCommon.openDonationModal){StudySphereCommon.openDonationModal();}else if(window.openDonationModalSafe){openDonationModalSafe();}else{const m=document.getElementById('donationModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" 
        type="button" 
        class="h-8 px-3 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-800 dark:text-amber-300 text-xs font-bold inline-flex items-center gap-1.5 btn-spring cursor-pointer shrink-0 border border-amber-500/25 shadow-2xs"
      >
        <i class="fa-solid fa-heart text-amber-500 text-xs"></i> <span>Donate</span>
      </button>

      <!-- Button 3: Share Platform -->
      <button 
        onclick="if(window.StudySphereCommon && window.StudySphereCommon.share){StudySphereCommon.share();}else if(window.triggerShareWebsite){triggerShareWebsite();}" 
        type="button" 
        class="h-8 px-3 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 text-xs font-bold inline-flex items-center gap-1.5 btn-spring cursor-pointer shrink-0 border border-emerald-400/30 shadow-2xs"
      >
        <i class="fa-solid fa-share-nodes text-xs"></i> <span>Share</span>
      </button>

      <!-- Button 4: Install PWA App -->
      <button 
        onclick="if(window.StudySphereCommon && window.StudySphereCommon.triggerPWAInstall){StudySphereCommon.triggerPWAInstall();}else{const m=document.getElementById('installModal');if(m){m.classList.remove('hidden');m.classList.add('flex');document.body.classList.add('overflow-hidden');}}" 
        type="button" 
        class="h-8 px-3 rounded-xl bg-slate-200/60 hover:bg-slate-200 dark:bg-white/10 dark:hover:bg-white/15 text-slate-700 dark:text-slate-200 text-xs font-bold inline-flex items-center gap-1.5 btn-spring cursor-pointer shrink-0 border border-slate-300/60 dark:border-white/15 shadow-2xs"
      >
        <i class="fa-solid fa-download text-xs text-slate-500 dark:text-slate-400"></i> <span>Install</span>
      </button>
    </div>

    <!-- 4. Official Accreditation & Copyright Line -->
    <div class="pt-1.5 space-y-0.5">

        MPSC २०२६-२७ Pattern Aligned • १००% मोफत व जाहिरातमुक्त
      </p>
