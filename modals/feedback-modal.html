<!-- ========================================================================= -->
<!-- COMPONENT: FEEDBACK MODAL                                                 -->
<!-- Path: modals/feedback-modal.html                                          -->
<!-- Description: Clean, responsive user feedback form connected to Google     -->
<!--              Sheets via Google Apps Script with 5-character validation.   -->
<!--              Strictly zero emojis (100% FontAwesome), accessible controls.-->
<!-- ========================================================================= -->
<div 
  id="feedbackModal" 
  role="dialog" 
  aria-modal="true" 
  class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-3 sm:p-4 select-none overflow-y-auto"
  onclick="if(event.target === this){if(window.StudySphereCommon && window.StudySphereCommon.closeFeedbackModal){StudySphereCommon.closeFeedbackModal();}else{this.classList.add('hidden');this.classList.remove('flex');document.body.classList.remove('overflow-hidden');}}"
>
  <div class="relative w-full max-w-sm rounded-3xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 shadow-2xl p-4 sm:p-5 text-slate-800 dark:text-slate-100 flex flex-col gap-3 my-auto max-h-[92vh] overflow-y-auto box-border animate-pop-in">
    
    <!-- 1. Header: Icon, Title & Close Button -->
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-2.5 shrink-0">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm font-bold border border-amber-500/30 shrink-0">
          <i class="fa-solid fa-comment-dots text-amber-500"></i>
        </span>
        <div class="min-w-0">
          <h3 class="text-sm font-black text-slate-900 dark:text-white truncate">Share Your Feedback</h3>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 font-bold truncate">Help us improve StudySphere</p>
        </div>
      </div>
      <button 
        type="button" 
        onclick="if(window.StudySphereCommon && window.StudySphereCommon.closeFeedbackModal){StudySphereCommon.closeFeedbackModal();}else{const m=document.getElementById('feedbackModal');if(m){m.classList.add('hidden');m.classList.remove('flex');document.body.classList.remove('overflow-hidden');}}" 
        class="w-7 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-800 dark:hover:text-white flex items-center justify-center cursor-pointer transition-colors btn-spring shrink-0 border border-slate-200 dark:border-slate-700"
        aria-label="Close Feedback Modal"
      >
        <i class="fa-solid fa-xmark text-xs font-black"></i>
      </button>
    </div>

    <!-- 2. Form Body (Keyboard safe with overflow support) -->
    <form id="feedbackForm" onsubmit="handleFeedbackFormSubmit(event)" class="space-y-2.5 flex-1">
      
      <!-- Feedback Type Chips (100% FontAwesome, Zero Emojis) -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 px-0.5">
          Feedback Category
        </label>
        <div class="flex items-center gap-1.5 flex-wrap">
          <button 
            type="button" 
            onclick="setFeedbackTopicTag('Feature Request / नवीन फिचर')" 
            class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-amber-500 btn-spring cursor-pointer flex items-center gap-1"
          >
            <i class="fa-solid fa-lightbulb text-[9px] text-amber-500"></i>
            <span>फिचर सूचना</span>
          </button>
          <button 
            type="button" 
            onclick="setFeedbackTopicTag('Question / Notes Error')" 
            class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-amber-500 btn-spring cursor-pointer flex items-center gap-1"
          >
            <i class="fa-solid fa-bug text-[9px] text-rose-500"></i>
            <span>त्रुटी नोंद</span>
          </button>
          <button 
            type="button" 
            onclick="setFeedbackTopicTag('Appreciation / अनुभव')" 
            class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-amber-500 btn-spring cursor-pointer flex items-center gap-1"
          >
            <i class="fa-solid fa-star text-[9px] text-amber-500"></i>
            <span>अनुभव</span>
          </button>
        </div>
      </div>

      <!-- Name Input (Optional) -->
      <div class="space-y-1">
        <label for="fbStudentName" class="block text-[10px] font-black uppercase tracking-wider text-slate-400 px-0.5">
          Your Name <span class="text-[9px] font-normal lowercase text-slate-400">(optional)</span>
        </label>
        <input 
          type="text" 
          id="fbStudentName" 
          placeholder="e.g. Rahul Patil" 
          class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 transition-all font-sans"
        />
      </div>

      <!-- Topic / Subject Context -->
      <div class="space-y-1">
        <label for="fbTopicName" class="block text-[10px] font-black uppercase tracking-wider text-slate-400 px-0.5">
          Topic / Exam Context
        </label>
        <input 
          type="text" 
          id="fbTopicName" 
          placeholder="e.g. Rajyaseva Polity / Group B" 
          class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 transition-all font-sans"
        />
      </div>

      <!-- Message Textarea (Mandatory: Minimum 5 characters) -->
      <div class="space-y-1">
        <label for="fbMessage" class="block text-[10px] font-black uppercase tracking-wider text-slate-400 px-0.5">
          Your Message <span class="text-rose-500">*</span>
        </label>
        <textarea 
          id="fbMessage" 
          rows="3" 
          required 
          placeholder="तुमचा अभिप्राय किंवा सूचना येथे लिहा (किमान ५ अक्षरे)..." 
          class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs focus:outline-none focus:border-amber-500 resize-none transition-all font-sans"
        ></textarea>
        <p id="fbErrorText" class="hidden text-[10px] text-rose-500 font-bold px-0.5">
          कृपया किमान ५ अक्षरांचा अर्थपूर्ण संदेश प्रविष्ट करा.
        </p>
      </div>

      <!-- Success Notification Banner -->
      <div id="fbSuccessBanner" class="hidden p-2 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-700 dark:text-emerald-400 text-center text-xs font-black flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-circle-check text-xs"></i>
        <span>धन्यवाद! तुमचा अभिप्राय यशस्वीरीत्या नोंदवला गेला आहे.</span>
      </div>

      <!-- Submit Action Button -->
      <button 
        type="submit" 
        id="btnSubmitFeedback" 
        class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-sm transition-all btn-spring cursor-pointer flex items-center justify-center gap-1.5"
      >
        <span id="btnFeedbackText">Submit Feedback</span>
        <i class="fa-solid fa-paper-plane text-[10px]"></i>
      </button>
    </form>

    <!-- 3. Security Footer -->
    <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-800 text-[10px] text-slate-500 dark:text-slate-400 font-bold flex items-center justify-center gap-1.5 shrink-0">
      <i class="fa-solid fa-lock text-amber-500 text-[10px]"></i>
      <span>Direct Sync with Official Google Sheets</span>
    </div>
  </div>
</div>

<!-- Inline Local Script Fallback (Guarantees zero-failure across all pages) -->
<script>
  (function initFeedbackModalBridge() {
    window.setFeedbackTopicTag = function(tag) {
      const topicInp = document.getElementById('fbTopicName');
      if (topicInp) {
        topicInp.value = tag;
        topicInp.focus();
      }
    };

    window.handleFeedbackFormSubmit = function(event) {
      if (window.StudySphereCommon && typeof window.StudySphereCommon.submitFeedback === 'function') {
        window.StudySphereCommon.submitFeedback(event);
      } else {
        if (event && event.preventDefault) event.preventDefault();
        const msgInp = document.getElementById('fbMessage');
        const nameInp = document.getElementById('fbStudentName');
        const topicInp = document.getElementById('fbTopicName');
        const errEl = document.getElementById('fbErrorText');
        const banner = document.getElementById('fbSuccessBanner');

        const msg = (msgInp?.value || "").trim();
        if (msg.length < 5) {
          if (errEl) errEl.classList.remove('hidden');
          return;
        }
        if (errEl) errEl.classList.add('hidden');

        const payload = {
          timestamp: new Date().toISOString(),
          studentName: nameInp?.value?.trim() || "Anonymous Aspirant",
          topicContext: topicInp?.value?.trim() || "General Practice",
          message: msg,
          platform: "StudySphere Web"
        };

        try {
          const list = JSON.parse(localStorage.getItem('qq_pending_feedback') || '[]');
          list.push(payload);
          localStorage.setItem('qq_pending_feedback', JSON.stringify(list.slice(-30)));
        } catch (e) {}

        if (banner) banner.classList.remove('hidden');
        if (msgInp) msgInp.value = "";

        setTimeout(() => {
          const m = document.getElementById('feedbackModal');
          if (m) {
            m.classList.add('hidden');
            m.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
          }
          if (banner) banner.classList.add('hidden');
        }, 1500);
      }
    };
  })();
</script>
